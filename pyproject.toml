[project]
name = "fisheries-mcp"
version = "0.1.0"
description = "Evidence-aware access to a public NOAA spring survey snapshot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.0,<4",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
# Local MCP server and public snapshot preparation commands.
fisheries-mcp = "fisheries_mcp.app:main"
fisheries-prepare = "fisheries_mcp.prepare:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fisheries_mcp"]

[dependency-groups]
# Development, test, and evaluation dependencies.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
presentation = ["python-pptx>=1.0.0", "python-docx>=1.1.0"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents"]
# Don't reformat Python code fences inside Markdown docs (they're illustrative
# snippets, not runnable modules).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
